name: Deploy to Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      - name: Create deployment package
        run: |
          tar -czf deploy.tar.gz \
            .next/ \
            public/ \
            package.json \
            package-lock.json \
            next.config.mjs \
            postcss.config.mjs \
            tailwind.config.ts \
            tsconfig.json

      - name: Copy deployment files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_PASSPHRASE }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "deploy.tar.gz"
          target: "/tmp"

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_PASSPHRASE }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            
            DEPLOY_DIR="/var/www/edreading"
            BACKUP_DIR="/var/www/edreading-backups"
            
            echo "Creating backup directory..."
            mkdir -p $BACKUP_DIR
            
            if [ -d "$DEPLOY_DIR" ]; then
              echo "Backing up current deployment..."
              timestamp=$(date +%Y%m%d_%H%M%S)
              if [ -d "$DEPLOY_DIR/.next" ]; then
                tar -czf "$BACKUP_DIR/backup_$timestamp.tar.gz" -C "$DEPLOY_DIR" .
                echo "Backup created: backup_$timestamp.tar.gz"
              fi
            fi
            
            echo "Preparing deployment directory..."
            mkdir -p $DEPLOY_DIR
            
            echo "Extracting new deployment..."
            tar -xzf /tmp/deploy.tar.gz -C $DEPLOY_DIR
            rm /tmp/deploy.tar.gz
            
            echo "Installing production dependencies..."
            cd $DEPLOY_DIR
            npm ci --omit=dev
            
            echo "Reloading PM2 process..."
            if pm2 list | grep -q "edreading"; then
              pm2 reload edreading
            else
              pm2 start npm --name "edreading" -- start
            fi
            
            echo "Saving PM2 configuration..."
            pm2 save
            
            echo "Deployment completed successfully!"
