name: Deploy to Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create source package
        run: |
          tar -czf deploy.tar.gz \
            --exclude=.git \
            --exclude=.github \
            --exclude=.next \
            --exclude=node_modules \
            --exclude=logs \
            --exclude=.vercel \
            --exclude=.env \
            --exclude=.env.* \
            .

      - name: Copy source package to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_PASSPHRASE }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "deploy.tar.gz"
          target: "/tmp"

      - name: Sync source on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_PASSPHRASE }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e

            DEPLOY_DIR="/var/www/edreading"
            BACKUP_DIR="/var/www/edreading-backups"
            TEMP_DIR="/tmp/edreading-source"

            echo "Creating backup directory..."
            mkdir -p $BACKUP_DIR

            if [ -d "$DEPLOY_DIR" ]; then
              echo "Backing up current source..."
              timestamp=$(date +%Y%m%d_%H%M%S)
              if [ -f "$DEPLOY_DIR/package.json" ]; then
                tar -czf "$BACKUP_DIR/backup_$timestamp.tar.gz" -C "$DEPLOY_DIR" .
                echo "Backup created: backup_$timestamp.tar.gz"
              fi
            fi

            echo "Preparing temporary source directory..."
            rm -rf "$TEMP_DIR"
            mkdir -p "$TEMP_DIR"

            echo "Extracting source package..."
            tar -xzf /tmp/deploy.tar.gz -C "$TEMP_DIR"
            rm /tmp/deploy.tar.gz

            echo "Preparing deployment directory..."
            mkdir -p $DEPLOY_DIR

            echo "Synchronizing source files..."
            rsync -av --delete \
              --exclude='.env.local' \
              --exclude='.env.production' \
              --exclude='.env' \
              --exclude='node_modules' \
              --exclude='.next' \
              --exclude='logs' \
              "$TEMP_DIR"/ "$DEPLOY_DIR"/

            rm -rf "$TEMP_DIR"

            echo "Source sync completed successfully."
            echo "Next step is handled on the server side: install deps, build, and restart via Baota/PM2."
